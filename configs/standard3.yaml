enemy_color: "red"
# enemy_color: "blue"

#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
device: CPU
min_confidence: 0.8
use_traditional: true

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75

#####-----aimer参数-----#####
yaw_offset: -0.2 # degree -2.5
pitch_offset: 0.75 # degree 2
comming_angle: 55 # degree
leaving_angle: 20 # degree
decision_speed: 11 # rad/s
high_speed_delay_time: 0.030 # s
low_speed_delay_time: 0.015 # s planner use this value

#####-----shooter参数-----#####
first_tolerance: 3 # 近距离射击容差，degree
second_tolerance: 2 # 远距离射击容差，degree
judge_distance: 2 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

camera_name: "hikrobot"
exposure_ms: 13
gain: 15.9
vid_pid: "2bdf:0001"

#  1  0  0
#  0  1  0
#  0  0  1
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]

# 重投影误差: 0.0334px
camera_matrix: [1791.858373584932, 0, 719.95067599122149, 0, 1791.7457836061449, 545.82156850565809, 0, 0, 1]
distort_coeffs: [-0.077974849423121703, 0.13247496615118545, -0.00090336649351075652, 0.0002310224321229288, 0]
# 相机同理想情况的偏角: yaw-0.06 pitch-3.76 roll-0.15 degree
R_camera2gimbal: [0.001226807608183611, -0.065516979500917213, 0.99785070042575463, -0.9999957008099265, -0.0027379821015214301, 0.0010496740807401891, 0.0026633258825257333, -0.99784769822407682, -0.065520056808242577]
t_camera2gimbal: [0.15589980822952626, -0.081390359618099192, 0.034814506509918151]
quaternion_canid: 0x100
bullet_speed_canid: 0x101
send_canid: 0xff
can_interface: "can0"

#####-----gimbal参数-----#####
com_port: "/dev/gimbal"
# com_port: "/dev/ttyACM0"
yaw_kp: 0
yaw_kd: 0
pitch_kp: 0
pitch_kd: 0

#####-----planner-----#####
fire_thresh: 0.0085

max_yaw_acc: 45
Q_yaw: [9e6, 0]
R_yaw: [1]

max_pitch_acc: 100
Q_pitch: [9e6, 0]
R_pitch: [1]

#####-----buff_detector参数-----#####
model: "assets/yolo11_buff_int8.xml"

#####-----buff_aimer参数-----#####
fire_gap_time: 0.700   # s
predict_time: 0.120     # s
